const TOPICS=[
 {id:"num",name:"🔢 數字",words:[["one","一","1️⃣"],["two","二","2️⃣"],["three","三","3️⃣"],["four","四","4️⃣"],["five","五","5️⃣"],["six","六","6️⃣"],["seven","七","7️⃣"],["eight","八","8️⃣"],["nine","九","9️⃣"],["ten","十","🔟"]]},

 {id:"animal",name:"🐶 動物",words:[["cat","貓","🐱"],["dog","狗","🐶"],["bird","鳥","🐦"],["fish","魚","🐟"],["pig","豬","🐷"],["duck","鴨子","🦆"],["rabbit","兔子","🐰"],["lion","獅子","🦁"],["monkey","猴子","🐵"],["elephant","大象","🐘"]]},

const synth=window.speechSynthesis; let voice=null, rate=0.72, run=0;
function pickVoice(){ if(!synth) return; const all=synth.getVoices(); const us=all.filter(v=>/^en[-_]US/i.test(v.lang));
  voice=us.find(v=>/Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name))||us[0]||all.find(v=>/^en/i.test(v.lang))||null }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice } else document.getElementById('nosound').hidden=false;
function say(text,id,onWord){ return new Promise(res=>{
  if(!synth||id!==run) return res();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=rate;
  if(onWord) u.onboundary=e=>{ if(e.name==='word'||e.name===undefined) onWord(e.charIndex) };
  u.onend=u.onerror=()=>res(); try{ synth.speak(u) }catch(e){ res() }
})}
const wait=(ms,id)=>new Promise(r=>setTimeout(r,ms));
function stopAll(){ run++; if(synth) synth.cancel(); document.querySelectorAll('.on,.lit,.turn').forEach(x=>x.classList.remove('on','lit','turn')) }
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function picHTML(w){ const v=w[2]; return v.startsWith('#')?`<span class="swatch" style="background:${v}"></span>`:`<span class="pic">${v}</span>` }

// ---------- 選項 ----------
$('slow').onclick=e=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',on); rate=on?0.72:0.95; e.currentTarget.textContent=on?'🐢 慢慢唸':'🐇 正常速度' };
$('zh').onclick=e=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',on); document.body.classList.toggle('nozh',!on); e.currentTarget.textContent=on?'中文 開':'中文 關' };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ stopAll(); document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t)); document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==t.dataset.p) });

// ---------- 單字 ----------
let curTopic=TOPICS[0];
function renderTopicChips(box,multi,onPick){
  box.innerHTML=''; TOPICS.forEach((T,i)=>{ const b=document.createElement('button'); b.textContent=T.name; b.dataset.id=T.id;
    b.setAttribute('aria-pressed', multi? 'true' : String(i===0)); b.onclick=()=>onPick(b,T); box.appendChild(b) });
}
renderTopicChips($('wtopics'),false,(b,T)=>{ stopAll(); $('wtopics').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); curTopic=T; renderWords() });
function renderWords(){
  const g=$('wgrid'); g.innerHTML='';
  curTopic.words.forEach(w=>{ const c=document.createElement('button'); c.className='wcard';
    c.innerHTML=`${picHTML(w)}<span class="wd">${w[0]}</span><span class="zh">${w[1]}</span>`;
    c.onclick=async()=>{ stopAll(); const id=run; c.classList.add('on'); await say(w[0],id); c.classList.remove('on') };
    g.appendChild(c) });
}
renderWords();
$('wall').onclick=async()=>{ stopAll(); const id=run; const cards=[...$('wgrid').children];
  for(let i=0;i<cards.length;i++){ if(id!==run) break; const c=cards[i]; c.classList.add('on'); c.scrollIntoView({block:'nearest',behavior:'smooth'});
    await say(curTopic.words[i][0],id); await wait(1400/rate*0.72); c.classList.remove('on') } };
$('wstop').onclick=stopAll;

// ---------- 句子 ----------
function bubbleHTML(en){ let out='',pos=0; en.split(/(\s+)/).forEach(tok=>{ if(/^\s+$/.test(tok)||!tok){ out+=tok; } else { out+=`<span class="w" data-i="${pos}">${esc(tok)}</span>` } pos+=tok.length }); return out }
async function speakBubble(bub,text,id){
  bub.classList.add('on'); const ws=[...bub.querySelectorAll('.w')]; let got=false;
  const light=ci=>{ got=true; ws.forEach(w=>w.classList.toggle('lit',+w.dataset.i<=ci && ci< +w.dataset.i+w.textContent.length+1)) };
  // fallback: step through words by time if the browser sends no word events
  let k=0; const step=setInterval(()=>{ if(got){clearInterval(step);return} ws.forEach((w,j)=>w.classList.toggle('lit',j===k)); k++ }, 330/rate);
  await say(text,id,light); clearInterval(step); ws.forEach(w=>w.classList.remove('lit')); bub.classList.remove('on');
}
DIALOGS.forEach(D=>{
  const d=document.createElement('div'); d.className='dlg';
  d.innerHTML=`<h3>${D.t} <span class="pat">${esc(D.p)}</span></h3>`+
    D.lines.map((L,i)=>`<div class="line ${i%2?'b':'a'}"><span class="ava">${D.a[i%2]}</span><button class="bub"><span class="en">${bubbleHTML(L[0])}</span><span class="zh">${L[1]}</span></button></div>`).join('')+
    `<div class="row"><button class="all">▶ 整段聽</button><button class="role">🎤 換你說</button><button class="st">■ 停止</button></div><p class="say" aria-live="polite"></p>`;
  const bubs=[...d.querySelectorAll('.bub')], msg=d.querySelector('.say');
  bubs.forEach((b,i)=>b.onclick=async()=>{ stopAll(); await speakBubble(b,D.lines[i][0],run) });
  d.querySelector('.all').onclick=async()=>{ stopAll(); const id=run; for(let i=0;i<bubs.length;i++){ if(id!==run) break; await speakBubble(bubs[i],D.lines[i][0],id); await wait(500) } };
  d.querySelector('.role').onclick=async()=>{ stopAll(); const id=run;
    for(let i=0;i<bubs.length;i++){ if(id!==run) break;
      if(i%2===0){ msg.textContent=''; await speakBubble(bubs[i],D.lines[i][0],id); await wait(300) }
      else { bubs[i].classList.add('turn'); const secs=Math.max(3,Math.ceil(D.lines[i][0].split(' ').length*0.8)+2);
        for(let s=secs;s>0;s--){ if(id!==run) break; msg.textContent=`換你說！（${s}）`; await wait(1000) }
        bubs[i].classList.remove('turn'); if(id!==run) break; msg.textContent='聽聽看電腦怎麼說：'; await speakBubble(bubs[i],D.lines[i][0],id); await wait(500) } }
    if(id===run) msg.textContent='完成了！👏 你好棒！' };
  d.querySelector('.st').onclick=()=>{ stopAll(); msg.textContent='' };
  $('dlgs').appendChild(d);
});

// ---------- 測驗 ----------
let qTopics=new Set(TOPICS.map(t=>t.id)), qMode='listen';
renderTopicChips($('qtopics'),true,(b,T)=>{ const on=b.getAttribute('aria-pressed')!=='true';
  if(!on && qTopics.size===1) return; b.setAttribute('aria-pressed',on); on?qTopics.add(T.id):qTopics.delete(T.id) });
$('qmodes').querySelectorAll('button').forEach(b=>b.onclick=()=>{ qMode=b.dataset.m; $('qmodes').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=[],qi=0,score=0,missed=[],locked=false,first=true;
function makeQuiz(){
  const pool=TOPICS.filter(t=>qTopics.has(t.id)).flatMap(t=>t.words.map(w=>({w,t})));
  const picks=shuffle(pool.slice()).slice(0,10);
  return picks.map(({w,t})=>{
    const same=shuffle(t.words.filter(x=>x[0]!==w[0])).slice(0,2);
    const mode=qMode==='mix'?(Math.random()<.5?'listen':'read'):qMode;
    return {w,mode,opts:shuffle([w,...same])};
  });
}
function show(id){ ['qintro','qrun','qdone'].forEach(x=>$(x).hidden=x!==id) }
function ask(){
  const q=Q[qi]; locked=false; first=true; $('qmsg').textContent=''; $('qstars').textContent='⭐'.repeat(score);
  $('qcount').textContent=`第 ${qi+1} / ${Q.length} 題`;
  if(q.mode==='listen'){ $('qprompt').innerHTML='<button class="qplay" id="qplay" aria-label="再聽一次">🔊</button>'; $('qask').textContent='聽一聽，是哪一個？'; $('qplay').onclick=playQ }
  else { $('qprompt').innerHTML=`<div class="qshow">${picHTML(q.w)}</div>`; $('qask').textContent='這個英文怎麼說？'; }
  const box=$('qopts'); box.innerHTML='';
  q.opts.forEach(o=>{ const b=document.createElement('button');
    b.innerHTML= q.mode==='listen'? picHTML(o) : `<span class="wd">${o[0]}</span>`;
    b.onclick=()=>answer(o,b); box.appendChild(b) });
  if(q.mode==='listen') playQ();
}
function playQ(){ stopAll(); say(Q[qi].w[0],run) }
function answer(o,b){
  if(locked) return; const q=Q[qi];
  if(o[0]===q.w[0]){ locked=true; b.classList.add('right'); if(first){score++; $('qstars').textContent='⭐'.repeat(score)}
    $('qmsg').innerHTML=`<span class="ok">答對了！</span> ${q.w[0]}（${q.w[1]}）`; stopAll(); say(q.w[0],run);
    setTimeout(()=>{ qi++; qi<Q.length?ask():finish() },1700);
  } else { b.classList.add('wrong'); b.disabled=true; if(first) missed.push(q.w); first=false;
    $('qmsg').innerHTML='<span class="no">再想想，再選一次！</span>'; if(q.mode==='listen') setTimeout(playQ,300) }
}
function finish(){
  show('qdone'); const n=Q.length;
  const msg=score===n?'太棒了！全部答對！🎉':score>=8?'很厲害！差一點點就全對了！':score>=5?'不錯喔！把答錯的再多聽幾次。':'沒關係，多練習再來挑戰！';
  const miss=[...new Map(missed.map(w=>[w[0],w])).values()];
  $('qdone').innerHTML=`<div class="qbig">${score} / ${n}</div><div class="qstars">${'⭐'.repeat(score)}</div><p class="qask">${msg}</p>`+
    (miss.length?`<p style="margin:0">答錯的單字，點一下再聽一次：</p><div class="qmiss">${miss.map(w=>`<button data-w="${w[0]}">🔊 ${w[0]}（${w[1]}）</button>`).join('')}</div>`:'')+
    `<div class="row" style="justify-content:center"><button class="primary" id="qagain">再測一次 ↻</button><button id="qback">換主題</button></div>`;
  $('qdone').querySelectorAll('.qmiss button').forEach(b=>b.onclick=()=>{ stopAll(); say(b.dataset.w,run) });
  $('qagain').onclick=start; $('qback').onclick=()=>show('qintro');
}
function start(){ Q=makeQuiz(); qi=0; score=0; missed=[]; show('qrun'); ask() }
$('qstart').onclick=start;
</script>

</body>
